name: Matrix names
on:
  push:
    branches: [matrix-probe]
jobs:
  plain:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  named:
    name: Named job
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  expr:
    name: Test on ${{ matrix.node }}
    strategy:
      matrix:
        node: [22]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  partial:
    name: Lint (${{ matrix.os }})
    strategy:
      matrix:
        os: [a]
        node: [1]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  include:
    strategy:
      matrix:
        os: [a, b]
        include:
          - os: a
            extra: x
          - os: c
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  exclude:
    strategy:
      matrix:
        os: [a, b]
        node: [1, 2]
        exclude:
          - os: b
            node: 2
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  object:
    strategy:
      matrix:
        cfg: [{name: x, v: 1}]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  onlyinclude:
    strategy:
      matrix:
        include:
          - os: a
            node: 1
          - os: b
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  scalars:
    strategy:
      matrix:
        flag: [true]
        num: [1.5]
        text: ['hello world']
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  single:
    strategy:
      matrix:
        os: [only]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  keyorder:
    strategy:
      matrix:
        zeta: [z]
        alpha: [a]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  includeorder:
    strategy:
      matrix:
        os: [a]
        include:
          - node: 9
            os: a
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
