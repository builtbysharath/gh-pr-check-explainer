name: Matrix names
on:
  push:
    branches: [matrix-probe]
jobs:
  newextra:
    strategy:
      matrix:
        os: [a]
        include:
          - os: c
            extra: y
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  conflict:
    strategy:
      matrix:
        os: [a, b]
        node: [1]
        include:
          - os: a
            node: 2
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  everywhere:
    strategy:
      matrix:
        os: [a, b]
        include:
          - extra: e
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  numbers:
    strategy:
      matrix:
        v: [22.0, '22.0', 1e3, 0x10, 007]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  nested:
    strategy:
      matrix:
        cfg: [{a: {b: 1}, c: [2, 3]}]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  emptyname:
    name: ${{ matrix.missing }}x
    strategy:
      matrix:
        os: [a]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  objectprop:
    name: Use ${{ matrix.cfg.name }}
    strategy:
      matrix:
        cfg: [{name: p, v: 1}]
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  nomatrix:
    name: Plain ${{ github.event_name }}
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
